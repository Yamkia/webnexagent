server {
    listen 80;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://odoo-19:8069;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_redirect off;
    }
}

# To enable HTTPS, mount valid TLS certs at /etc/ssl/certs/fullchain.pem and
# /etc/ssl/private/privkey.pem, then restore a 443 server block.
