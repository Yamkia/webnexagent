server {
    listen 80 default_server;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://web:5001;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_redirect off;
    }
}

# HTTPS is disabled by default in this configuration.
# To enable HTTPS, mount valid TLS certs at /etc/ssl/certs/fullchain.pem and
# /etc/ssl/private/privkey.pem, then add a dedicated 443 server block.
